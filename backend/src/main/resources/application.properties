# ==============================================================================
# INVEST-TRACKER - APPLICATION CONFIGURATION
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Configuração do Banco de Dados PostgreSQL (Datasource & JDBC)
# ------------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/invest_tracker}

# Pool de Conexões JDBC
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=16

# ------------------------------------------------------------------------------
# 2. Hibernate ORM & Panache (Mapeamento Objeto-Relacional)
# ------------------------------------------------------------------------------
# Gera e atualiza automaticamente as tabelas (users, wallets, assets, etc.)
quarkus.hibernate-orm.database.generation=update

# Exibe e formata as queries SQL no console durante o desenvolvimento
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.format-sql=true

# ------------------------------------------------------------------------------
# 3. Redis (Cache / Client NoSQL)
# ------------------------------------------------------------------------------
quarkus.redis.hosts=redis://localhost:6379

# ------------------------------------------------------------------------------
# 4. Segurança & Autenticação JWT (SmallRye JWT)
# ------------------------------------------------------------------------------
mp.jwt.verify.issuer=https://invest-tracker.com
# Em produção, aponte para chaves geradas no servidor (NUNCA use as chaves commitadas no repositório)
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}

# ------------------------------------------------------------------------------
# 5. Serviço de E-mails (Quarkus Mailer)
# ------------------------------------------------------------------------------
quarkus.mailer.from=no-reply@invest-tracker.com
quarkus.mailer.mock=true
invest-tracker.app.url=http://localhost:8080

# ------------------------------------------------------------------------------
# 6. Documentação da API com OpenAPI & Swagger UI
# ------------------------------------------------------------------------------
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi

# ------------------------------------------------------------------------------
# 7. Servidor HTTP & CORS
# ------------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.cors=true
# Em dev aceita qualquer origem; em produção, apenas o domínio do front (ex: CORS_ORIGINS=https://app.invest-tracker.com)
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
%dev.quarkus.http.cors.origins=/.*/
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS, HEAD

# ------------------------------------------------------------------------------
# 8. Autorização (quem pode acessar o quê)
# ------------------------------------------------------------------------------
# "Negar por padrão": endpoint sem @PermitAll, @Authenticated ou @RolesAllowed é bloqueado.
# Esquecer uma anotação vira um 403 visível, e não uma rota aberta por acidente.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Autenticação sob demanda: o token só é validado quando a rota exige login.
# Assim, erros de token (401) passam pelo nosso GlobalExceptionHandler e seguem o mesmo JSON de erro.
quarkus.http.auth.proactive=false

# Primeiro administrador do sistema (criado pelo AdminSeeder na inicialização, se não existir nenhum ADMIN).
# Em produção, defina as variáveis de ambiente ADMIN_EMAIL e ADMIN_PASSWORD.
invest-tracker.admin.email=${ADMIN_EMAIL:}
invest-tracker.admin.password=${ADMIN_PASSWORD:}
%dev.invest-tracker.admin.email=admin@invest-tracker.com
%dev.invest-tracker.admin.password=admin123
